<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Soft outer drop shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.14" />
    </filter>
    <!-- Subtle 3D gradient for the outer disc -->
    <radialGradient id="discShine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
  </defs>

  <!-- Outer circular disc badge with bevel and shadow -->
  <circle cx="250" cy="250" r="236" fill="url(#discShine)" stroke="#e2e8f0" stroke-width="4" filter="url(#badgeShadow)" />
  <circle cx="250" cy="250" r="226" fill="#ffffff" stroke="#f1f5f9" stroke-width="2" />

  <!-- Steering Wheel Main Body (Bangladeshi Green) -->
  <!-- Outer rim -->
  <circle cx="250" cy="250" r="202" fill="#007941" />

  <!-- White cutouts that carve out the steering wheel spokes -->
  
  <!-- 1. Top Wide Arched Window Cutout -->
  <path d="M 130 205
           C 130 130, 185 85, 250 85
           C 315 85, 370 130, 370 205
           C 335 188, 295 180, 250 180
           C 205 180, 165 188, 130 205 Z"
        fill="#ffffff" />

  <!-- 2. Bottom-Left Curved Triangular Cutout -->
  <path d="M 125 250
           C 140 252, 175 262, 205 285
           C 208 325, 195 375, 165 408
           C 125 365, 102 310, 125 250 Z"
        fill="#ffffff" />

  <!-- 3. Bottom-Right Curved Triangular Cutout -->
  <path d="M 375 250
           C 360 252, 325 262, 295 285
           C 292 325, 305 375, 335 408
           C 375 365, 398 310, 375 250 Z"
        fill="#ffffff" />

  <!-- Center Hub: White Border Ring and Red Sun -->
  <circle cx="250" cy="252" r="56" fill="#ffffff" />
  <circle cx="250" cy="252" r="41" fill="#F42A41" />

  <!-- Grip Buttons / Slots (3 on the left, 3 on the right) -->
  <!-- Left Gripper Pills -->
  <rect x="148" y="218" width="28" height="11" rx="5.5" fill="#ffffff" />
  <rect x="143" y="238" width="28" height="11" rx="5.5" fill="#ffffff" />
  <rect x="138" y="258" width="28" height="11" rx="5.5" fill="#ffffff" />

  <!-- Right Gripper Pills -->
  <rect x="324" y="218" width="28" height="11" rx="5.5" fill="#ffffff" />
  <rect x="329" y="238" width="28" height="11" rx="5.5" fill="#ffffff" />
  <rect x="334" y="258" width="28" height="11" rx="5.5" fill="#ffffff" />
</svg>
